name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sublime Text builds 4050–4204 run the plugin with Python 3.8 (.python-version).
          # setup-python has 3.8 for Ubuntu 24.04 but not for ubuntu-latest.
          - { python: '3.8', os: ubuntu-24.04 }
          # Builds 4205 and later run it with Python 3.14.
          - { python: '3.14', os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Lint (ruff)
        if: matrix.python == '3.14'
        run: |
          python -m pip install ruff==0.14.5
          ruff check .
          ruff format --check .

      # The logic without Sublime Text, with a fake API: no network, no API key.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  review:
    # The checks Package Control's reviewers run on a submitted package.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: false

      - name: Package reviewer
        run: >-
          uvx --from git+https://github.com/kaste/st_package_reviewer.git@v1.4.0
          st_package_reviewer --package-name "Converter Studio" --st-build 4107 --fail-on-warnings .
